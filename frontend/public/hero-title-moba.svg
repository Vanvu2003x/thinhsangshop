<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none">
  <defs>
    <linearGradient id="topFill" x1="0" y1="54" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.22" stop-color="#effcff"/>
      <stop offset="0.5" stop-color="#aeefff"/>
      <stop offset="0.74" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#65caff"/>
    </linearGradient>
    <linearGradient id="shopFill" x1="0" y1="218" x2="0" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4ffff"/>
      <stop offset="0.2" stop-color="#74f5ff"/>
      <stop offset="0.52" stop-color="#0c9cff"/>
      <stop offset="0.78" stop-color="#0063df"/>
      <stop offset="1" stop-color="#c2fbff"/>
    </linearGradient>
    <filter id="logoGlow" x="-14%" y="-28%" width="128%" height="162%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="10" flood-color="#001126" flood-opacity="0.96"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#42eaff" flood-opacity="0.78"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#0078ff" flood-opacity="0.4"/>
    </filter>
    <style>
      .topText {
        font-family: Impact, "Arial Black", sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
        paint-order: stroke fill;
        stroke-linejoin: round;
      }
      .shopText {
        font-family: Impact, "Arial Black", sans-serif;
        font-weight: 900;
        letter-spacing: 10px;
        paint-order: stroke fill;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <g filter="url(#logoGlow)">
    <text class="topText" x="600" y="190" text-anchor="middle" font-size="134" fill="url(#topFill)" stroke="#03142f" stroke-width="24">THỊNH SÁNG</text>
    <text class="topText" x="600" y="190" text-anchor="middle" font-size="134" fill="url(#topFill)" stroke="#7ef3ff" stroke-width="3.5" opacity="0.95">THỊNH SÁNG</text>

    <path d="M210 232H990" stroke="#1fe8ff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M286 252H914" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.78"/>

    <text class="shopText" x="600" y="374" text-anchor="middle" font-size="178" fill="url(#shopFill)" stroke="#03142f" stroke-width="24">SHOP</text>
    <text class="shopText" x="600" y="374" text-anchor="middle" font-size="178" fill="url(#shopFill)" stroke="#b3fbff" stroke-width="4" opacity="0.95">SHOP</text>
  </g>
</svg>
